# Sonar analyzes the template without its sibling RoleBinding. The rendered manifest verifier confirms that the Job's
# serviceAccountName has an exact binding, so S6865 is a false positive for this Helm template.
sonar.issue.ignore.multicriteria.cleanupServiceAccount.ruleKey=kubernetes:S6865
sonar.issue.ignore.multicriteria.cleanupServiceAccount.resourceKey=charts/qubership-monitoring-operator/templates/operator/rbac-cleanup-job.yaml
# Sonar analyzes the template without Helm values. The rendered manifest verifier confirms the default 256Mi memory
# limit, so S6864 is a false positive for this Helm template.
sonar.issue.ignore.multicriteria.cleanupMemoryLimit.ruleKey=kubernetes:S6864
sonar.issue.ignore.multicriteria.cleanupMemoryLimit.resourceKey=charts/qubership-monitoring-operator/templates/operator/rbac-cleanup-job.yaml
