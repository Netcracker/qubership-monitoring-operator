{{- if and .Values.mcp.install .Values.mcp.serviceAccountToken }}
{{- if .Values.mcp.existingSecret.name }}
{{- fail "grafana.mcp.serviceAccountToken and grafana.mcp.existingSecret.name are mutually exclusive" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-token" (include "grafana.mcp.fullname" .)) .Values.mcp.tokenSecret.name }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" (include "grafana.mcp.fullname" .)) | nindent 4 }}
type: Opaque
stringData:
  {{ default "token" .Values.mcp.tokenSecret.key }}: {{ .Values.mcp.serviceAccountToken | quote }}
{{- end }}
{{- if and .Values.mcp.install .Values.mcp.basicAuth.password }}
{{- if .Values.mcp.basicAuth.passwordSecret.name }}
{{- fail "grafana.mcp.basicAuth.password and grafana.mcp.basicAuth.passwordSecret.name are mutually exclusive" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-basic-auth" (include "grafana.mcp.fullname" .) }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" (include "grafana.mcp.fullname" .)) | nindent 4 }}
type: Opaque
stringData:
  {{ default "password" .Values.mcp.basicAuth.passwordSecret.key }}: {{ .Values.mcp.basicAuth.password | quote }}
{{- end }}
