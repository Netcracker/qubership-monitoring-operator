{{- if .Values.cleanup.deleteCRs -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vm.cleanup.rbac.fullname" . }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" (include "vm.cleanup.rbac.fullname" .)) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/resource-policy": keep
rules:
  - apiGroups:
      - operator.victoriametrics.com
    resources:
      - vmauths
      - vmusers
      - vmagents
      - vmalerts
      - vmsingles
      - vmalertmanagers
      - vmclusters
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - get
      - patch
      - update
{{- end -}}
