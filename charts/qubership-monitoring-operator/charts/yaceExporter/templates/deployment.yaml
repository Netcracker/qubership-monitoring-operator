{{- if .Values.install }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ template "yace-exporter.instance" . }}
    app.kubernetes.io/version: {{ template "yace-exporter.version" . }}
    app.kubernetes.io/technology: go
    {{- include "monitoring.extraLabels" . | nindent 4 }}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        {{- include "monitoring.labels" . | nindent 8 }}
        app.kubernetes.io/instance: {{ template "yace-exporter.instance" . }}
        app.kubernetes.io/version: {{ template "yace-exporter.version" . }}
        app.kubernetes.io/technology: go
        {{- include "monitoring.extraLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the rendered configuration or the AWS credentials change,
        # so that updates apply without a manual restart.
        checksum/config: {{ tpl .Values.config . | sha256sum }}
        checksum/secrets: {{ printf "%s:%s:%s" ((.Values.aws.secret).name | default "") (.Values.aws.aws_access_key_id | default "") (.Values.aws.aws_secret_access_key | default "") | sha256sum }}
        {{- if .Values.annotations }}
          {{ toYaml .Values.annotations | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      containers:
        - name: {{ .Values.name }}
          image: {{ template "yace-exporter.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if .Values.command }}
          command: {{ toYaml .Values.command | nindent 12 }}
          {{- else }}
          args:
            - -listen-address={{ .Values.listenAddress }}
            - -config.file={{ .Values.configFile }}
            {{- with .Values.extraArgs }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if include "yace-exporter.awsCredentialsEnabled" . }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ ((.Values.aws.secret).name) | default .Values.name }}
                  key: {{ if ((.Values.aws.secret).name) }}access_key{{ else }}aws_access_key_id{{ end }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ ((.Values.aws.secret).name) | default .Values.name }}
                  key: {{ if ((.Values.aws.secret).name) }}secret_key{{ else }}aws_secret_access_key{{ end }}
            {{- if and ((.Values.aws.secret).name) .Values.aws.secret.includesSessionToken }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.secret.name }}
                  key: security_token
            {{- end }}
          {{- end }}
          ports:
            - name: container-port
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: container-port
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: container-port
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          resources:
            {{ include "yaceExporter.resources" $ }}
          volumeMounts:
            - name: vol-yace-exporter
              mountPath: /config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{ include "yace-exporter.securityContext" . }}
      {{- if .Values.serviceAccount.install }}
      serviceAccount: {{ .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      volumes:
      - configMap:
          defaultMode: 420
          name: {{ .Values.name }}
        name: vol-yace-exporter
{{- end }}
