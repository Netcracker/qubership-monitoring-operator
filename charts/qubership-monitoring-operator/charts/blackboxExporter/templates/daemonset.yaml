{{- if and .Values.install .Values.asDaemonSet }}
{{- $name := .Values.name -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ cat $name "-" .Release.Namespace | nospace | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/version: {{ splitList ":" (include "blackboxExporter.image" .) | last }}
    app.kubernetes.io/technology: go
    {{- include "monitoring.extraLabels" . | nindent 4 }}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "monitoring.labels" . | nindent 8 }}
        app.kubernetes.io/instance: {{ cat $name "-" .Release.Namespace | nospace | trunc 63 | trimSuffix "-" }}
        app.kubernetes.io/version: {{ splitList ":" (include "blackboxExporter.image" .) | last }}
        app.kubernetes.io/technology: go
        {{- include "monitoring.extraLabels" . | nindent 8 }}
      {{- if .Values.annotations }}
      annotations:
        {{- toYaml .Values.annotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        {{- include "blackboxExporter.securityContext" . | nindent 8 }}
      tolerations:
      {{- if .Values.tolerations }}
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- else }}
        - operator: Exists
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      containers:
        - name: blackbox-exporter
          image: {{ template "blackboxExporter.image" . }}
          securityContext:
            {{- include "blackboxExporter.containerSecurityContext" . | nindent 12 }}
          args:
            - "--config.file=/config/blackbox.yaml"
          {{- if .Values.extraArgs }}
            {{ toYaml .Values.extraArgs | nindent 12 }}
          {{- end }}
          resources:
            {{ include "blackboxExporter.resources" $ }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
            - mountPath: /tmp
              name: tmp
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      volumes:
      - name: config
        {{- if .Values.secretConfig }}
        secret:
          secretName: {{ $name }}
        {{- else if .Values.configExistingSecretName }}
        secret:
          secretName: {{ .Values.configExistingSecretName }}
        {{- else }}
        configMap:
          name: {{ $name }}
      {{- end }}
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
{{- end }}
