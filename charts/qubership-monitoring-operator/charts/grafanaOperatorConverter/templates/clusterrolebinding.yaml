{{- if and .Values.grafana.converter.enable (not (include "grafana-operator-converter.watchNamespaces" .)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "grafana-operator-converter.fullname" . }}
  labels:
    {{- include "grafana-operator-converter.labels" . | nindent 4 }}
    {{- with .Values.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grafana-operator-converter.serviceAccountName" . }}
    namespace: {{ include "grafana-operator-converter.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "grafana-operator-converter.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
