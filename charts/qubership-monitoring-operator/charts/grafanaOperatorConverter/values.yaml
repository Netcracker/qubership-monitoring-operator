# -- Use the operator namespace for watches and RBAC when `watchNamespaces` is empty.
namespaceScope: false

# -- If you want to run multiple replicas of the grafana-operator, this is not recommended.
leaderElect: false

# -- Sets `WATCH_NAMESPACE` to the exact comma-separated namespace list. A nonempty list must contain at least one
# namespace. An empty value uses cluster scope unless `namespaceScope` is true.
watchNamespaces: ""

# -- Reserved for compatibility and rejected when set. Converter informers cannot apply dynamic namespace selection.
watchNamespaceSelector: ""

# -- Deprecated compatibility value. The converter does not access OpenShift Route resources.
isOpenShift: false

# -- Additional environment variables. WATCH_NAMESPACE and WATCH_NAMESPACE_SELECTOR are reserved.
env: []
  # -- grafana image, e.g. docker.io/grafana/grafana:9.1.6, overwrites the default grafana image defined in the operator
  # - name: RELATED_IMAGE_GRAFANA
  #   value: "docker.io/grafana/grafana:9.1.6"
  # - name: MY_VAR
  #   value: "myvalue"

# -- Converter image. The default, set in the chart helpers, pins a multi-architecture image by digest.
# image: ghcr.io/netcracker/qubership-grafana-operator-converter:main

# -- Image pull policy for the converter container
imagePullPolicy: IfNotPresent

# -- image pull secrets
imagePullSecrets: []

# -- Overrides the name of the chart.
nameOverride: ""

# -- Overrides the fully qualified app name.
fullnameOverride: ""

# -- Overrides the namespace name.
namespaceOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

metricsService:
  # -- metrics service type
  type: ClusterIP
  # -- metrics service port
  metricsPort: 9090

# -- additional labels to add to all resources
additionalLabels: {}

# -- pod annotations
podAnnotations: {}

# -- pod security context
podSecurityContext: {}

# -- grafana operator container security context
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# -- Converter container resources. Each request or limit you leave unset keeps its default:
# requests cpu 50m, memory 64Mi, ephemeral-storage 16Mi; limits cpu 200m, memory 256Mi, ephemeral-storage 256Mi.
# The ephemeral-storage limit also covers the dashboards emptyDir.
resources: {}

# -- pod priority class name
priorityClassName: ""

# -- pod node selector
nodeSelector: {}

# -- pod tolerations
tolerations: []

# -- pod affinity
affinity: {}

# -- Enable this to use with Prometheus Operator
serviceMonitor:
  # -- When set true then use a ServiceMonitor to configure scraping
  enabled: false
  # -- Set of labels to transfer from the Kubernetes Service onto the target
  additionalLabels: {}
  # -- Set how frequently Prometheus should scrape
  interval: 1m
  # -- Set timeout for scrape
  scrapeTimeout: 10s
  # -- Set path to metrics path
  telemetryPath: /metrics
  # -- Set of labels to transfer from the Kubernetes Service onto the target
  targetLabels: []
  # -- MetricRelabelConfigs to apply to samples before ingestion
  metricRelabelings: []
  # -- Set relabel_configs as per https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
  relabelings: []


# Creates Grafana resources
# from group integreatly.org version v1alpha1 to group grafana.integreatly.org v1beta1
# Type: object
# Mandatory: no
#
grafana:
  converter:
    enable: true
    dashboard: true
    # -- Legacy dashboards to convert, as a list of Kubernetes label selectors. Unset converts every legacy dashboard.
    # A dashboard matches when any one selector matches.
    # While Grafana is installed, Monitoring Operator replaces this value with grafana.dashboardLabelSelector from
    # PlatformMonitoring. Set the selector there instead.
    dashboardLabelSelector:
    # -- Namespace label selector for legacy dashboards. Unset does not filter by namespace labels. An empty selector
    # matches every namespace. Applies only to a cluster-wide watch.
    # While Grafana is installed, Monitoring Operator replaces this value with grafana.dashboardNamespaceSelector from
    # PlatformMonitoring. Set the selector there instead.
    dashboardNamespaceSelector:
    # -- Delete a converted dashboard when its legacy source is deleted, through a Kubernetes owner reference.
    # The default keeps the converted dashboard.
    deleteTargetOnSourceDeletion: false
    # -- Convert legacy dashboards whose content is in a ConfigMap referenced by spec.gzipConfigMapRef.
    # Grants the converter get, list, and watch on ConfigMaps in every watched namespace.
    resolveGzipConfigMapRef: false
    # -- Maximum decompressed size of dashboard content read through gzipConfigMapRef.
    gzipConfigMapMaxDecompressedSize: 32Mi
    # The monitoring CRD bundle retains only the legacy GrafanaDashboard CRD. Enable the other converters only when
    # their corresponding integreatly.org CRDs are installed separately.
    datasource: false
    folder: false
    notification: false
    instanceSelector:
      matchLabels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/part-of: monitoring
