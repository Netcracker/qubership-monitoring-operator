{{- if .Values.global.privilegedRights }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-rbac-cleanup-hook
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" "monitoring-rbac-cleanup-hook") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/resource-policy": keep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-rbac-cleanup-hook
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" "monitoring-rbac-cleanup-hook") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/resource-policy": keep
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - clusterroles
    verbs:
      - delete
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-rbac-cleanup-hook
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" "monitoring-rbac-cleanup-hook") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/resource-policy": keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-rbac-cleanup-hook
subjects:
  - kind: ServiceAccount
    name: monitoring-rbac-cleanup-hook
    namespace: {{ .Release.Namespace }}
{{- end }}
