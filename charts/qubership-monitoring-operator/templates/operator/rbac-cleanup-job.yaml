{{- $values := .Values | toJson | fromJson -}}
{{- $cleanupHook := dig "victoriametrics" "cleanup" "hook" (dict) $values -}}
{{- if .Values.global.privilegedRights }}
apiVersion: batch/v1
kind: Job
metadata:
  name: monitoring-rbac-cleanup-hook
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" "monitoring-rbac-cleanup-hook") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
    "helm.sh/resource-policy": keep
spec:
  {{- if (get $cleanupHook "ttlSecondsAfterFinished" | default 180) }}
  ttlSecondsAfterFinished: {{ get $cleanupHook "ttlSecondsAfterFinished" | default 180 }}
  {{- end }}
  template:
    metadata:
      name: monitoring-rbac-cleanup-hook
      labels:
        {{- include "monitoring.labels" (dict "ctx" . "name" "monitoring-rbac-cleanup-hook") | nindent 8 }}
      {{- if .Capabilities.APIVersions.Has "security.openshift.io/v1/SecurityContextConstraints" }}
      annotations:
        openshift.io/required-scc: restricted-v2
      {{- end }}
    spec:
      # The matching post-delete ClusterRoleBinding is rendered by rbac-cleanup-rbac.yaml.
      serviceAccountName: monitoring-rbac-cleanup-hook
      restartPolicy: OnFailure
      {{- with (get $cleanupHook "nodeSelector") }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (get $cleanupHook "affinity") }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (get $cleanupHook "tolerations") }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "monitoring.cleanup.securityContext" . | nindent 8 }}
      containers:
        - name: kubectl
          image: {{ get $cleanupHook "image" | default "docker.io/rancher/kuberlr-kubectl:v8.0.0" }}
          imagePullPolicy: IfNotPresent
          {{- with (get $cleanupHook "resources") }}
          # The cleanup hook defaults include a memory limit, which the render verifier checks.
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "monitoring.cleanup.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - >
              set -eu;
              kubectl delete clusterrolebindings.rbac.authorization.k8s.io
              --selector=app.kubernetes.io/managed-by-operator=monitoring-operator,monitoring.netcracker.com/installation-namespace={{ .Release.Namespace }}
              --ignore-not-found=true --wait=true
              --timeout={{ get $cleanupHook "deleteTimeout" | default "5m" }};
              kubectl delete clusterroles.rbac.authorization.k8s.io
              --selector=app.kubernetes.io/managed-by-operator=monitoring-operator,monitoring.netcracker.com/installation-namespace={{ .Release.Namespace }}
              --ignore-not-found=true --wait=true
              --timeout={{ get $cleanupHook "deleteTimeout" | default "5m" }};
              {{- if .Capabilities.APIVersions.Has "security.openshift.io/v1/SecurityContextConstraints" }}
              if kubectl get securitycontextconstraints/{{ printf "%s-node-exporter" .Release.Namespace }}
              -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}{"|"}{.metadata.labels.monitoring\.netcracker\.com/installation-namespace}{"|"}{.metadata.annotations.monitoring\.netcracker\.com/platform-monitoring-name}{"|"}{.metadata.annotations.monitoring\.netcracker\.com/platform-monitoring-namespace}' 2>/dev/null
              | grep -Fqx {{ printf "monitoring-operator|%s|platformmonitoring|%s" .Release.Namespace .Release.Namespace | quote }}; then
              kubectl delete securitycontextconstraints/{{ printf "%s-node-exporter" .Release.Namespace }}
              --ignore-not-found=true --wait=true
              --timeout={{ get $cleanupHook "deleteTimeout" | default "5m" }};
              fi;
              {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
{{- end }}
