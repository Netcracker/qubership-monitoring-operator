{{- if .Values.grafana }}
{{- if .Values.grafana.install }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-extra-vars-secret
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "name" "grafana-extra-vars-secret" "component" "grafana") | nindent 4 }}
type: Opaque
stringData:
{{- if .Values.auth}}
{{- if .Values.auth.clientId}}
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ .Values.auth.clientId }}
{{- end}}
{{- if .Values.auth.clientSecret}}
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ .Values.auth.clientSecret }}
{{- end}}
{{- end}}
{{- if .Values.grafana.extraVarsSecret }}
  {{- $reservedOfflineSettings := dict
    "GF_PLUGINS_PREINSTALL_DISABLED" true
    "GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED" true
    "GF_ANALYTICS_CHECK_FOR_UPDATES" true
    "GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES" true
    "GF_ANALYTICS_REPORTING_ENABLED" true
    "GF_NEWS_NEWS_FEED_ENABLED" true
  }}
  {{- range $key, $val := .Values.grafana.extraVarsSecret }}
  {{- if not (hasKey $reservedOfflineSettings $key) }}
  {{ $key | quote | indent 6}}: {{ $val | quote }}
  {{- end }}
{{- end}}
{{- end}}
{{- end}}
{{- end}}
