---
name: PR Auto-Assignment
run-name: "Assigning reviewers for PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-auto-assign:
    runs-on: ubuntu-latest

    steps:
      - name: Check if PR is from a fork
        env:
          FULL_NAME_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          FULL_NAME_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          if [ "${FULL_NAME_HEAD_REPO}" != "${FULL_NAME_BASE_REPO}" ]; then
            echo "⚠️ Pull request is from a fork — skipping assignee assignment (no write permissions)."
            exit 0
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: netcracker/qubership-workflow-hub/actions/pr-assigner@b6bee6f61fdc8b367777c1173fc852a58878a6a7 # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
