name: 'Tests: Run monitoring integration tests'

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .github/workflows/integration-tests.yaml
      - .github/expected-vm-cr-statuses.json
      - api/**
      - charts/**
      - cmd/**
      - controllers/**
      - test/robot-tests/**
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/integration-tests.yaml
      - .github/expected-vm-cr-statuses.json
      - api/**
      - charts/**
      - cmd/**
      - controllers/**
      - test/robot-tests/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  Wait-for-images:
    if: |
      (
        github.event_name != 'pull_request' || (
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - name: Wait for build.yaml to complete
        uses: netcracker/qubership-workflow-hub/actions/wait-for-workflow@cf536587a99a23b3614aa4db4bdbf13cf36059b6 # v2.8.3
        id: wait
        with:
          workflow: build.yaml
          token: ${{ secrets.GITHUB_TOKEN }}

  Monitoring-Pipeline:
    needs: [Wait-for-images]
    if: |
      needs.Wait-for-images.outputs.conclusion == 'success' &&
        (
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        )
    uses: netcracker/qubership-test-pipelines/.github/workflows/monitoring.yaml@d5786358e2e534552aa82fea2e419fe1e4a88df7 # v1.18.0
    with:
      service_branch: ${{ github.sha }}
      pipeline_branch: 'd5786358e2e534552aa82fea2e419fe1e4a88df7' # v1.18.0 renovate: depName=Netcracker/qubership-test-pipelines
      repository_name: '${{ github.repository_owner }}/qubership-monitoring-operator'
      kind-layout: 'single-node'
      enable-owner-references-permission-enforcement: true
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
      AWS_S3_ACCESS_KEY_SECRET: ${{ secrets.AWS_S3_ACCESS_KEY_SECRET }}
