---
name: Build Artifacts

on:
  release:
    types: [created]
  push:
    branches:
    - main
    tags:
    - 'v*'
    paths:
    - '**'
    - '!.github/**'
    - '.github/workflows/integration-tests.yaml'
    - '.github/workflows/build.yaml'
    - '!CODE-OF-CONDUCT.md'
    - '!CONTRIBUTING.md'
    - '!LICENSE'
    - '!README.md'
    - '!SECURITY.md'
  pull_request:
    branches:
    - '**'
  workflow_dispatch:
    inputs:
      tags:
        required: false
        type: string
        default: ''
        description: 'Tags'
      dry-run:
        required: true
        type: boolean
        default: false
        description: 'Dry run'

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Match changed files against the build paths
      id: filter
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
          echo 'build=true' >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        # Capture git diff before iterating so a failed listing cannot yield build=false.
        changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
        echo "Changed files:"
        printf '%s\n' "${changed}"

        build=false
        while IFS= read -r file; do
          case "${file}" in
            .github/workflows/build.yaml|.github/workflows/integration-tests.yaml|docs|docs/*|.dockerignore)
              build=true
              break
              ;;
            .github/*|CODE-OF-CONDUCT.md|CONTRIBUTING.md|LICENSE|README.md|SECURITY.md)
              ;;
            *)
              build=true
              break
              ;;
          esac
        done <<< "${changed}"
        echo "build=${build}" >> "${GITHUB_OUTPUT}"

  multiplatform_build:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: qubership-monitoring-operator
          description: Qubership Monitoring Operator image
          file: cmd/operator/Dockerfile
          context: .
        - name: qubership-etcd-certs-to-secret
          file: cmd/etcd-certs-to-secret/Dockerfile
          context: .
        - name: qubership-monitoring-transfer
          description: Qubership Monitoring documentation and helm charts image
          file: docker-transfer/Dockerfile
          context: .
        - name: qubership-monitoring-int-tests
          description: Qubership Monitoring integration tests image
          file: test/robot-tests/Dockerfile
          context: test/robot-tests
    runs-on: ubuntu-latest
    name: ${{ matrix.component.name }}
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - name: Build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64,linux/arm64
        push: false
        provenance: false

  multiplatform_publish:
    needs: [changes]
    if: >-
      github.event_name != 'pull_request' &&
      needs.changes.outputs.build == 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: qubership-monitoring-operator
          description: Qubership Monitoring Operator image
          file: cmd/operator/Dockerfile
          context: .
        - name: qubership-etcd-certs-to-secret
          file: cmd/etcd-certs-to-secret/Dockerfile
          context: .
        - name: qubership-monitoring-transfer
          description: Qubership Monitoring documentation and helm charts image
          file: docker-transfer/Dockerfile
          context: .
        - name: qubership-monitoring-int-tests
          description: Qubership Monitoring integration tests image
          file: test/robot-tests/Dockerfile
          context: test/robot-tests
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.component.name }}
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set image name
      run: |
        OWNER="${{ github.repository_owner }}"
        OWNER=$(echo "${OWNER,,}" | sed -E 's/[^a-z0-9._-]+/-/g')
        echo "FULL_IMAGE_NAME=ghcr.io/${OWNER}/${{ matrix.component.name }}" >>${GITHUB_ENV}
      env:
        IMAGE_NAME: '${{ github.repository }}'
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: "${{ env.FULL_IMAGE_NAME }}"
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=git-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
        flavor: |
          latest=${{ github.ref == 'refs/heads/main' }}
        labels: |
          org.opencontainers.image.description=${{ matrix.component.description }}
        annotations: |
          org.opencontainers.image.description=${{ matrix.component.description }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  build-gate:
    name: Build Gate
    needs: [changes, multiplatform_build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Require the expected build result
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.build != 'false' && needs.multiplatform_build.result != 'success')
      run: exit 1
