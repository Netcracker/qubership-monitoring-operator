---
name: "Tests: Go test with Sonar"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/test-sonar-go-coverage.yaml
      - api/**
      - cmd/**
      - controllers/**
      - go.*
      - Makefile
      - test/envtests/**
  # CI Gate is a required check, so this workflow must report on every pull
  # request. The path filter moved into the changes job below, which skips the
  # tests themselves when no Go sources changed.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    name: Detect Go changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files against the Go test paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Outside a pull request the trigger-level path filter already decided.
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            echo 'go=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Keep in sync with the push trigger paths above.
          patterns=(
            '^[.]github/workflows/test-sonar-go-coverage[.]yaml$'
            '^Makefile$'
            '^api/'
            '^cmd/'
            '^controllers/'
            '^go[.][^/]+$'
            '^test/envtests/'
          )
          pattern="$(IFS='|'; printf '%s' "${patterns[*]}")"

          # --no-renames lists both endpoints of a move, so a file renamed out of
          # a watched directory still counts as a change to that directory.
          changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files:"
          printf '%s\n' "${changed}"

          # A here-string rather than a pipe: grep -q exits on its first match, and
          # under pipefail a still-writing printf would take SIGPIPE and turn a
          # match into a false negative once the file list outgrows the pipe buffer.
          if grep -qE "${pattern}" <<< "${changed}"; then
            echo 'go=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'go=false' >> "${GITHUB_OUTPUT}"
            echo '::notice::No Go sources changed, skipping tests and coverage'
          fi

  envtest-minimum-kubernetes:
    name: Envtest with Kubernetes 1.25
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run envtests
        run: make envtest ENVTEST_K8S_VERSION=1.25.x!

  prepare:
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve sonar project key based on restricted actors
        id: config
        env:
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          restricted=$(python3 -c "
          import yaml, os
          with open('.github/config/build-config.yaml') as f:
              config = yaml.safe_load(f)
          actors = config.get('restricted-actors', [])
          current_actors = [os.environ['ACTOR'], os.environ.get('PR_AUTHOR', '')]
          print('true' if any(actor in actors for actor in current_actors) else 'false')
          ")
          if [ "$restricted" = "true" ]; then
            echo "sonar-project-key=" >> "$GITHUB_OUTPUT"
          else
            echo "sonar-project-key=${SONAR_PROJECT_KEY}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: prepare
    name: Build and test with coverage
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      go-module-dir: '.'
      sonar-project-key: ${{ needs.prepare.outputs.sonar-project-key }}
      cover-packages: './api/...,./cmd/...,./controllers/...'
      install-envtest: true
      kube-version: '1.30.0'
      envtest-version: 'release-0.19'
      skip-docker: true
    secrets: inherit # zizmor: ignore[secrets-inherit] generic-go-build requires inherited SONAR_TOKEN.
    permissions:
      contents: read
      pull-requests: write
      packages: write

  ci-gate:
    name: CI Gate
    needs: [changes, envtest-minimum-kubernetes, prepare, test]
    # Runs even when a dependency fails, so the check resolves instead of being
    # skipped. Skipped test jobs mean no Go sources changed.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
