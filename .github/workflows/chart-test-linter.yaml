name: Lint and Test Helm Charts

permissions: {}

concurrency:
  group: helm-chart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'api/v1/**'
      - '.gitattributes'
      - '.github/workflows/chart-test-linter.yaml'
      - 'tools/boilerplate.go.txt'
      - 'go.mod'
      - 'go.sum'
      - 'controllers/**'
      - 'charts/**'
      - 'tools/crd-update/**'
      - 'tools/verify-grafana-offline-settings.sh'
      - 'tools/verify-helm-crds.sh'
      - 'Makefile'
  push:
    branches:
      - main
    paths:
      - 'api/v1/**'
      - '.gitattributes'
      - '.github/workflows/chart-test-linter.yaml'
      - 'tools/boilerplate.go.txt'
      - 'go.mod'
      - 'go.sum'
      - 'controllers/**'
      - 'charts/**'
      - 'tools/crd-update/**'
      - 'tools/verify-grafana-offline-settings.sh'
      - 'tools/verify-helm-crds.sh'
      - 'Makefile'
  workflow_dispatch: null

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Chart Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install CRD updater dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --only-binary=:all: --require-hashes \
            -r tools/crd-update/requirements.txt

      - name: Test CRD updater
        run: .venv/bin/python -m unittest tools/crd-update/test_crd_update.py

      - name: Verify generated files
        run: make verify-generated PYTHON=.venv/bin/python

      - name: Verify required CRDs
        run: tools/verify-helm-crds.sh

      - name: Verify Grafana offline settings
        run: tools/verify-grafana-offline-settings.sh

      - name: Copy examples for ct in /charts/qubership-monitoring-operator/ci/
        run: |
            mkdir -p charts/qubership-monitoring-operator/ci
            cp docs/examples/deploy-parameters/*.yaml charts/qubership-monitoring-operator/ci/
            cp docs/examples/deploy-parameters/**/*.yaml charts/qubership-monitoring-operator/ci/
            ls -la charts charts/qubership-monitoring-operator charts/qubership-monitoring-operator/ci

      - name: Run chart-testing (lint)
        run: ct lint --check-version-increment=false --validate-maintainers=false --target-branch=main --chart-dirs=charts
