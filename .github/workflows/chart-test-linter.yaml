name: Lint and Test Helm Charts

permissions: {}

concurrency:
  group: helm-chart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Chart Gate is a required check, so this workflow must report on every pull
  # request. The path filter moved into the changes job below, which skips the
  # validation itself when nothing relevant changed.
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - main
    paths:
      - 'api/v1/**'
      - '.gitattributes'
      - '.github/workflows/chart-test-linter.yaml'
      - 'tools/boilerplate.go.txt'
      - 'go.mod'
      - 'go.sum'
      - 'controllers/**'
      - 'charts/**'
      - 'docs/examples/deploy-parameters/**'
      - 'tools/crd-update/**'
      - 'tools/verify-grafana-offline-settings.sh'
      - 'tools/verify-helm-crds.sh'
      - 'tools/verify-subchart-paths.sh'
      - 'Makefile'
  workflow_dispatch: null

jobs:
  changes:
    name: Detect chart changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files against the chart validation paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Outside a pull request the trigger-level path filter already decided.
          if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
            echo 'charts=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Keep in sync with the push trigger paths above.
          patterns=(
            '^[.]gitattributes$'
            '^[.]github/workflows/chart-test-linter[.]yaml$'
            '^Makefile$'
            '^api/v1/'
            '^charts/'
            '^controllers/'
            '^docs/examples/deploy-parameters/'
            '^go[.](mod|sum)$'
            '^tools/boilerplate[.]go[.]txt$'
            '^tools/crd-update/'
            '^tools/verify-grafana-offline-settings[.]sh$'
            '^tools/verify-helm-crds[.]sh$'
            '^tools/verify-subchart-paths[.]sh$'
          )
          pattern="$(IFS='|'; printf '%s' "${patterns[*]}")"

          # --no-renames lists both endpoints of a move, so a file renamed out of
          # a watched directory still counts as a change to that directory.
          changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files:"
          printf '%s\n' "${changed}"

          # A here-string rather than a pipe: grep -q exits on its first match, and
          # under pipefail a still-writing printf would take SIGPIPE and turn a
          # match into a false negative once the file list outgrows the pipe buffer.
          if grep -qE "${pattern}" <<< "${changed}"; then
            echo 'charts=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'charts=false' >> "${GITHUB_OUTPUT}"
            echo '::notice::No chart or API sources changed, skipping chart validation'
          fi

  lint-test:
    needs: [changes]
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Chart Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install CRD updater dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --only-binary=:all: --require-hashes \
            -r tools/crd-update/requirements.txt

      - name: Test CRD updater
        run: .venv/bin/python -m unittest tools/crd-update/test_crd_update.py

      - name: Verify generated files
        run: make verify-generated PYTHON=.venv/bin/python

      - name: Verify required CRDs
        run: tools/verify-helm-crds.sh

      - name: Verify subchart paths
        run: tools/verify-subchart-paths.sh

      - name: Verify Grafana offline settings
        run: tools/verify-grafana-offline-settings.sh

      - name: Copy examples for ct in /charts/qubership-monitoring-operator/ci/
        run: |
            mkdir -p charts/qubership-monitoring-operator/ci
            cp docs/examples/deploy-parameters/*.yaml charts/qubership-monitoring-operator/ci/
            cp docs/examples/deploy-parameters/**/*.yaml charts/qubership-monitoring-operator/ci/
            ls -la charts charts/qubership-monitoring-operator charts/qubership-monitoring-operator/ci

      - name: Run chart-testing (lint)
        run: ct lint --check-version-increment=false --validate-maintainers=false --target-branch=main --chart-dirs=charts

  chart-gate:
    name: Chart Gate
    needs: [changes, lint-test]
    # Runs even when a dependency fails, so the check resolves instead of being
    # skipped. A skipped lint-test means the validation did not apply.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
