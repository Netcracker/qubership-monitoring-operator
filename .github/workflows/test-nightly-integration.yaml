name: 'Tests: Run nightly monitoring integration tests'

permissions:
  contents: read

on:
  push
#  schedule:
#    - cron: '0 0 * * *'

jobs:
  Nightly-Monitoring-Pipeline:
    uses: netcracker/qubership-test-pipelines/.github/workflows/monitoring.yaml@feat/update_monitoring_pipeline # v1.14.2
    with:
      service_branch: main
      pipeline_branch: 'feat/update_monitoring_pipeline' # v1.14.2 renovate: depName=Netcracker/qubership-test-pipelines
      repository_name: '${{ github.repository_owner }}/qubership-monitoring-operator'
      kind-layout: 'single-node'
      scope: 'nightly'
      verify_timeout_minutes: 30
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}
