name: 'Tests: Run nightly monitoring integration tests'

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  Nightly-Monitoring-Pipeline:
    uses: netcracker/qubership-test-pipelines/.github/workflows/monitoring.yaml@747df4a75b81fd05ed818a8cde6fc8198b2989c0 # v1.19.0
    with:
      service_branch: main
      pipeline_branch: '422683f66379be6fa7557276b65e0e0babe02721' # v1.18.2 renovate: depName=Netcracker/qubership-test-pipelines
      repository_name: '${{ github.repository_owner }}/qubership-monitoring-operator'
      kind-layout: 'single-node'
      scope: 'nightly'
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}
