apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: monitoring-operator
  name: monitoring-prometheus-operator
rules:
  # Permissions to create downstream custom resources
  - apiGroups:
      - "monitoring.coreos.com"
    resources:
      - alertmanagers
      - alertmanagers/finalizers
      - alertmanagers/status
      - alertmanagerconfigs
      - alertmanagerconfigs/status
      - prometheuses
      - prometheuses/finalizers
      - prometheuses/status
      - prometheusagents
      - prometheusagents/finalizers
      - prometheusagents/status
      - prometheusrules
      - prometheusrules/finalizers
      - prometheusrules/status
      - thanosrulers
      - thanosrulers/finalizers
      - thanosrulers/status
      - podmonitors
      - podmonitors/finalizers
      - podmonitors/status
      - probes
      - probes/finalizers
      - probes/status
      - servicemonitors
      - servicemonitors/finalizers
      - servicemonitors/status
      - scrapeconfigs
      - scrapeconfigs/status
    verbs:
      - 'get'
      - 'list'
      - 'watch'
      - 'create'
      - 'delete'
      - 'update'
      - 'patch'
  - apiGroups:
      - "apps"
    resources:
      - statefulsets
    verbs:
      - 'create'
      - 'delete'
      - 'get'
      - 'list'
      - 'update'
      - 'watch'
      - 'patch'
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - 'create'
      - 'delete'
      - 'get'
      - 'list'
      - 'update'
      - 'watch'
      - 'patch'
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - 'list'
      - 'delete'
  - apiGroups:
      - ""
    resources:
      - services
      - services/finalizers
      - endpoints
    verbs:
      - 'get'
      - 'list'
      - 'watch'
      - 'create'
      - 'update'
      - 'delete'
      - 'patch'
