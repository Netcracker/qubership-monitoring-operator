apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: legacy-simple-dashboard
  labels:
    app.kubernetes.io/component: monitoring
spec:
  name: legacy-simple-dashboard.json
  customFolderName: Legacy dashboards
  json: >
    {
      "id": null,
      "uid": "legacy-simple-dashboard",
      "title": "Legacy Simple Dashboard",
      "tags": ["legacy"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "panels": [],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 39,
      "version": 1
    }
