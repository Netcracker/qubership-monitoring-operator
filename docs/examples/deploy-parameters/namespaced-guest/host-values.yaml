# Host overlay beside a namespaced guest (see values.yaml in this directory).
# Pair with: helm upgrade ... -n <host-ns> -f this file
#
# The host stays privileged. Set the same comma-separated namespace list on
# WATCH_NAMESPACE and grafana.operator.watchNamespaces. The deployment owns
# that list: name each namespace the host operators watch. Omit the guest
# namespace and every namespace labeled openshift.io/cluster-monitoring=true.
# VictoriaMetrics Operator v0.73.1 selects VM inputs from every namespace on
# WATCH_NAMESPACE. Workload namespace selectors do not narrow that list.
# This file uses `monitoring`, the host namespace in the example install.
# Replace it for any other cluster.

victoriametrics:
  vmOperator:
    extraEnvs:
      - name: WATCH_NAMESPACE
        value: monitoring

grafana:
  operator:
    watchNamespaces: monitoring
