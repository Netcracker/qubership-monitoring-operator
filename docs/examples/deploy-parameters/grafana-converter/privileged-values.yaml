# Grafana converter in privileged mode.
# The converter watches every namespace and gets a ClusterRole.
# The dashboard selectors limit which legacy dashboards are converted. Remove them to convert every legacy dashboard.

global:
  privilegedRights: true

grafana:
  install: true

grafanaConverter:
  install: true
  config:
    dashboard:
      # Convert only legacy dashboards that match one of these selectors.
      labelSelector:
        - matchLabels:
            app.kubernetes.io/component: monitoring
        # Built-in dashboards carry this label. Keep this selector, or Grafana has no built-in dashboards.
        - matchLabels:
            app.kubernetes.io/processed-by-operator: grafana-operator
      # Convert only legacy dashboards in namespaces with this label. Applies to the cluster-wide watch only.
      # Label the release namespace too: built-in dashboards live there.
      # Helm merges this with the default selector, which excludes namespaces labeled
      # openshift.io/cluster-monitoring=true.
      namespaceSelector:
        matchLabels:
          monitoring: enabled
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  serviceMonitor:
    enabled: true
