# Administrator-owned RBAC for Qubership Monitoring Operator appVersion 0.88.0.
# Render this file with envsubst after setting MONITORING_NAMESPACE to the
# PlatformMonitoring namespace. Keep this file aligned with the chart version.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${MONITORING_NAMESPACE}-kube-state-metrics
  labels:
    app.kubernetes.io/component: kube-state-metrics
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: monitoring-operator
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - nodes
      - pods
      - services
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${MONITORING_NAMESPACE}-kube-state-metrics
  labels:
    app.kubernetes.io/component: kube-state-metrics
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: monitoring-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${MONITORING_NAMESPACE}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: ${MONITORING_NAMESPACE}-kube-state-metrics
    namespace: ${MONITORING_NAMESPACE}
