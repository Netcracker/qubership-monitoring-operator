# Administrator-owned RBAC for Qubership Monitoring Operator appVersion 0.88.0.
# Render this file with envsubst after setting MONITORING_NAMESPACE to the
# PlatformMonitoring namespace. Keep this file aligned with the chart version.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${MONITORING_NAMESPACE}-vmagent
  labels:
    app.kubernetes.io/component: victoriametrics
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: monitoring-operator
rules:
- verbs:
    - get
    - list
    - watch
  apiGroups:
    - ''
  resources:
    - nodes
    - nodes/metrics
    - nodes/proxy
    - services
    - endpoints
    - pods
    - namespaces
- verbs:
    - get
    - list
    - watch
  apiGroups:
    - 'discovery.k8s.io'
  resources:
    - endpointslices
- verbs:
    - get
    - list
    - watch
  apiGroups:
    - networking.k8s.io
    - extensions
  resources:
    - ingresses
- verbs:
    - get
    - list
    - watch
  nonResourceURLs:
    - /metrics
    - /metrics/resources
- verbs:
    - get
  apiGroups:
    - route.openshift.io
    - image.openshift.io
  resources:
    - routers/metrics
    - registry/metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${MONITORING_NAMESPACE}-vmagent
  labels:
    app.kubernetes.io/component: victoriametrics
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: monitoring-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${MONITORING_NAMESPACE}-vmagent
subjects:
  - kind: ServiceAccount
    name: ${MONITORING_NAMESPACE}-vmagent
    namespace: ${MONITORING_NAMESPACE}
